[project]
name = "ootm-assistant"
version = "0.1.0"
description = "Unofficial clarification assistant for Odyssey of the Mind coaches"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
laya = ["laya>=0.3,<0.4"]
dev = ["pytest>=8"]

[project.scripts]
ootm-ask = "ootm_assistant.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
